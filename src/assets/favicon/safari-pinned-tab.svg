<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="Side Git">
  <title>Side Git</title>

  <!-- Monochrome silhouette for Safari pinned tabs: a single solid colour on
       transparent (Safari recolours it via the link's `color` attr). A mask
       carves the face out (so it reads as a cat) while keeping the eyes solid
       — robust regardless of path winding. -->
  <mask id="sg-mask">
    <!-- white = kept, black = hole -->
    <g fill="#fff">
      <path d="M20 56 C18 35 22 19 28 20 C34 23 40 41 43 49 Z" />
      <path d="M68 56 C70 35 66 19 60 20 C54 23 48 41 45 49 Z" />
      <ellipse cx="44" cy="63" rx="33" ry="31" />
      <rect x="74" y="30" width="22" height="66" rx="7" />
    </g>
    <!-- face hole -->
    <rect x="23" y="55" width="42" height="31" rx="15" fill="#000" />
    <!-- eyes back in -->
    <circle cx="36" cy="68" r="5.5" fill="#fff" />
    <circle cx="53" cy="68" r="5.5" fill="#fff" />
  </mask>

  <rect x="0" y="0" width="128" height="128" fill="#000000" mask="url(#sg-mask)" />
</svg>
